name: SYNERGY V7 Historical Snapshot

on:
  pull_request:
    branches: [main]
    paths:
      - scripts/capture_synergy_v7_fork_snapshot.js
      - .github/workflows/synergy-v7-historical-snapshot.yml
  workflow_dispatch:

jobs:
  capture-v7-state:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FORK_BLOCK_NUMBER: "90790000"
      LOCAL_FORK_URL: "http://127.0.0.1:8545"
      POLYGON_RPC_URL: "https://polygon.drpc.org"
      V3_SCAN_DISTANCE_TICKS: "30000"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Install dependencies
        run: npm ci

      - name: Start pinned Polygon fork
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          anvil --fork-url "$POLYGON_RPC_URL" --fork-block-number "$FORK_BLOCK_NUMBER" --chain-id 137 --hardfork shanghai --host 127.0.0.1 --port 8545 > reports/synergy-v7-snapshot-anvil.log 2>&1 &
          for i in $(seq 1 90); do
            if curl -s "$LOCAL_FORK_URL" -H 'content-type: application/json' --data '{"jsonrpc":"2.0","method":"eth_chainId","params":[],"id":1}' | grep -q '0x89'; then exit 0; fi
            sleep 1
          done
          cat reports/synergy-v7-snapshot-anvil.log
          exit 1

      - name: Capture exact V2 and Algebra V3 state
        shell: bash
        run: |
          set -euo pipefail
          npx hardhat run scripts/capture_synergy_v7_fork_snapshot.js --network polygonFork --no-compile 2>&1 | tee reports/synergy-v7-snapshot.log

      - name: Upload historical snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synergy-v7-historical-snapshot-90790000
          path: reports/*
          if-no-files-found: error
