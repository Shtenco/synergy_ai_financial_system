name: Real Liquidity Multiplier V4

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  real-liquidity-multiplier-v4:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FORK_BLOCK_NUMBER: "90790000"
      LOCAL_FORK_URL: "http://127.0.0.1:8545"
      POLYGON_RPC_URL: "https://polygon.drpc.org"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Install dependencies
        run: |
          npm ci
          python -m pip install --upgrade numpy matplotlib

      - name: Patch reserved Solidity identifier
        run: perl -0pi -e 's/\breference\b/referencePrice/g' contracts/fork/SynergyQEForkHarness.sol

      - name: Compile contracts
        run: npx hardhat compile

      - name: Run deterministic V4 economic model
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          python simulation/real_liquidity_multiplier_v4.py 2>&1 | tee reports/real-liquidity-v4-deterministic.log

      - name: Run V4 1000x20000 Monte Carlo
        shell: bash
        run: |
          set -euo pipefail
          python simulation/monte_carlo_real_liquidity_multiplier_v4.py 2>&1 | tee reports/real-liquidity-v4-monte-carlo.log

      - name: Run V4 stress matrix
        shell: bash
        run: |
          set -euo pipefail
          python simulation/stress_real_liquidity_multiplier_v4.py 2>&1 | tee reports/real-liquidity-v4-stress.log

      - name: Start Polygon fork
        shell: bash
        run: |
          set -euo pipefail
          anvil --fork-url "$POLYGON_RPC_URL" --fork-block-number "$FORK_BLOCK_NUMBER" --chain-id 137 --hardfork shanghai --host 127.0.0.1 --port 8545 > reports/real-liquidity-v4-anvil.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -s "$LOCAL_FORK_URL" -H 'content-type: application/json' --data '{"jsonrpc":"2.0","method":"eth_chainId","params":[],"id":1}' | grep -q '0x89'; then exit 0; fi
            sleep 1
          done
          cat reports/real-liquidity-v4-anvil.log
          exit 1

      - name: Run real QuickSwap V3 Polygon fork test
        shell: bash
        run: |
          set -euo pipefail
          npx hardhat test test/real_liquidity_multiplier_v4_polygon_fork.js --network polygonFork 2>&1 | tee reports/real-liquidity-v4-polygon-fork.log

      - name: Validate the single V4 invariant
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_real_liquidity_multiplier_v4.py 2>&1 | tee reports/real-liquidity-v4-verdict.log

      - name: Upload V4 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-liquidity-multiplier-v4-evidence
          path: reports/*
          if-no-files-found: warn
