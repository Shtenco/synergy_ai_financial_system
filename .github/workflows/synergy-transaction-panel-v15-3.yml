name: SYNERGY V15.3 Transaction Panel Econometrics

on:
  pull_request:
    branches: [audit/synergy-qe-polygon-fork]
    paths:
      - "package.json"
      - "economics/v15_3_transaction_panel_spec.json"
      - "economics/v15_3_v14_empirical_prior.json"
      - "scripts/collect_polygon_transaction_panel_v15_3.js"
      - "scripts/replay_transaction_panel_v15_3.py"
      - "econometrics/estimate_transaction_panel_v15_3.py"
      - "scripts/validate_transaction_panel_v15_3.py"
      - "tests/test_transaction_panel_v15_3.py"
      - "docs/V15_3_TRANSACTION_PANEL_AND_REAL_COEFFICIENTS.md"
      - "test/external_revenue_v15_1_historical_polygon_fork.js"
      - "contracts/v15_1/**"
      - ".github/workflows/synergy-transaction-panel-v15-3.yml"
  workflow_dispatch:
    inputs:
      start_block:
        description: "First Polygon block in the transaction panel"
        required: false
        default: "91250000"
        type: string
      end_block:
        description: "Last Polygon block in the transaction panel"
        required: false
        default: "91266308"
        type: string
      minimum_victim_usdc:
        description: "Minimum actual QuickSwap V2 USDC -> WPOL transaction"
        required: false
        default: "100"
        type: string
      maximum_raw_rows:
        description: "Maximum raw historical transactions"
        required: false
        default: "250"
        type: string
      replay_limit:
        description: "Maximum evenly spaced transactions to replay strictly"
        required: false
        default: "40"
        type: string

concurrency:
  group: synergy-v15-3-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  transaction-panel:
    runs-on: ubuntu-22.04
    timeout-minutes: 300
    env:
      POLYGON_RPC_URL: "https://polygon.drpc.org"
      V153_START_BLOCK: ${{ github.event_name == 'workflow_dispatch' && inputs.start_block || '91266209' }}
      V153_END_BLOCK: ${{ github.event_name == 'workflow_dispatch' && inputs.end_block || '91266308' }}
      V153_MIN_VICTIM_USDC: ${{ github.event_name == 'workflow_dispatch' && inputs.minimum_victim_usdc || '100' }}
      V153_MAX_RAW_ROWS: ${{ github.event_name == 'workflow_dispatch' && inputs.maximum_raw_rows || '25' }}
      V153_REPLAY_LIMIT: ${{ github.event_name == 'workflow_dispatch' && inputs.replay_limit || '5' }}
      V153_ESTIMATION_SEED: "153"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Install dependencies
        run: npm ci

      - name: Validate V15.3 committed sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          python -m json.tool economics/v15_3_transaction_panel_spec.json >/dev/null
          python -m json.tool economics/v15_3_v14_empirical_prior.json >/dev/null
          node --check scripts/collect_polygon_transaction_panel_v15_3.js
          python -m py_compile \
            scripts/replay_transaction_panel_v15_3.py \
            econometrics/estimate_transaction_panel_v15_3.py \
            scripts/validate_transaction_panel_v15_3.py
          python -m unittest tests/test_transaction_panel_v15_3.py -v \
            2>&1 | tee reports/v15_3_unit_tests.log
          npx hardhat compile 2>&1 | tee reports/v15_3_compile.log

      - name: Collect actual Polygon transaction-level covariates
        shell: bash
        run: |
          set -euo pipefail
          node scripts/collect_polygon_transaction_panel_v15_3.js \
            2>&1 | tee reports/v15_3_raw_panel.log

      - name: Replay actual victims and measure strict post-cost edge
        shell: bash
        run: |
          set -euo pipefail
          python scripts/replay_transaction_panel_v15_3.py \
            2>&1 | tee reports/v15_3_replay.log

      - name: Estimate time-split real coefficients
        shell: bash
        run: |
          set -euo pipefail
          python econometrics/estimate_transaction_panel_v15_3.py \
            2>&1 | tee reports/v15_3_estimation.log

      - name: Recompute strict 2.685148 bps and 80 percent reinvestment gates
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_transaction_panel_v15_3.py \
            2>&1 | tee reports/v15_3_validator.log

      - name: Upload complete V15.3 empirical evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synergy-v15-3-transaction-panel-econometrics
          path: |
            reports/v15_3_*
            reports/v15_1_historical_polygon_fork.json
          if-no-files-found: error
          compression-level: 6
