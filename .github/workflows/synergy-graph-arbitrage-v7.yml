name: SYNERGY V7 Graph Arbitrage

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  synergy-v7-graph:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      FORK_BLOCK_NUMBER: "90790000"
      LOCAL_FORK_URL: "http://127.0.0.1:8545"
      POLYGON_RPC_URL: "https://polygon.drpc.org"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Install dependencies
        run: |
          npm ci
          python -m pip install --upgrade numpy

      - name: Patch reserved Solidity identifier
        run: perl -0pi -e 's/\breference\b/referencePrice/g' contracts/fork/SynergyQEForkHarness.sol

      - name: Compile V7 contracts
        run: npx hardhat compile

      - name: Run V7 graph model and Monte Carlo
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          python simulation/synergy_graph_arbitrage_v7.py 2>&1 | tee reports/synergy-graph-v7-model.log

      - name: Start Polygon fork
        shell: bash
        run: |
          set -euo pipefail
          anvil --fork-url "$POLYGON_RPC_URL" --fork-block-number "$FORK_BLOCK_NUMBER" --chain-id 137 --hardfork shanghai --host 127.0.0.1 --port 8545 > reports/synergy-graph-v7-anvil.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -s "$LOCAL_FORK_URL" -H 'content-type: application/json' --data '{"jsonrpc":"2.0","method":"eth_chainId","params":[],"id":1}' | grep -q '0x89'; then exit 0; fi
            sleep 1
          done
          cat reports/synergy-graph-v7-anvil.log
          exit 1

      - name: Run V7 strict topology Polygon fork
        shell: bash
        run: |
          set -euo pipefail
          npx hardhat test test/synergy_graph_arbitrage_v7_polygon_fork.js --network polygonFork 2>&1 | tee reports/synergy-graph-v7-polygon-fork.log

      - name: Validate V7 graph acceptance criteria
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_synergy_graph_v7.py 2>&1 | tee reports/synergy-graph-v7-verdict.log

      - name: Upload V7 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synergy-v7-graph-arbitrage-evidence
          path: reports/*
          if-no-files-found: warn
