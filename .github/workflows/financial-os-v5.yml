name: Financial OS V5

on:
  push:
    branches: ["feat/financial-os-v4-20260809"]
  pull_request:
    paths:
      - "financial_os_v4/**"
      - "simulation/financial_os_v5_integrated.py"
      - "tests/test_financial_os*.py"
      - "tests/test_accounting*.py"
      - ".github/workflows/financial-os-v5.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile new Financial OS modules
        run: python -m compileall -q financial_os_v4 simulation/financial_os_v5_integrated.py tests
      - name: Run Financial OS feature tests
        run: python -m unittest discover -s tests -p "test_financial_os*.py" -v
      - name: Run accounting feature tests
        run: python -m unittest discover -s tests -p "test_accounting*.py" -v
      - name: Run Productive Credit tests
        run: python -m unittest tests.test_productive_credit -v
