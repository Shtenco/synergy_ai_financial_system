name: Consolidated Solvency V3

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  consolidated-solvency:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FORK_BLOCK_NUMBER: "90790000"
      LOCAL_FORK_URL: "http://127.0.0.1:8545"
      POLYGON_RPC_URL: "https://polygon.drpc.org"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Install Node dependencies
        run: npm ci

      - name: Install simulation dependencies
        run: python -m pip install --upgrade numpy matplotlib

      - name: Patch reserved Solidity identifier
        run: perl -0pi -e 's/\breference\b/referencePrice/g' contracts/fork/SynergyQEForkHarness.sol

      - name: Compile all contracts
        run: npx hardhat compile

      - name: Test 1000 internal cycles zero PnL
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          npx hardhat test test/consolidated_internal_cycle_zero_pnl.js --network hardhat 2>&1 | tee reports/internal-zero-pnl.log

      - name: Test 1000 external issue and QT cycles
        shell: bash
        run: |
          set -euo pipefail
          npx hardhat test test/external_mm_revenue_cycle.js --network hardhat 2>&1 | tee reports/external-mm-revenue.log

      - name: Test zero revenue safe pause
        shell: bash
        run: |
          set -euo pipefail
          npx hardhat test test/zero_revenue_safe_pause.js --network hardhat 2>&1 | tee reports/zero-revenue-pause.log

      - name: Test external profit only dividend
        shell: bash
        run: |
          set -euo pipefail
          npx hardhat test test/dividend_external_profit_only.js --network hardhat 2>&1 | tee reports/dividend-external-profit.log

      - name: Test redemption stress states
        shell: bash
        run: |
          set -euo pipefail
          npx hardhat test test/stress_redemptions.js --network hardhat 2>&1 | tee reports/stress-redemptions.log

      - name: Test gas oracle and bridge gates
        shell: bash
        run: |
          set -euo pipefail
          npx hardhat test test/stress_gas_oracle_bridge.js --network hardhat 2>&1 | tee reports/stress-gas-oracle-bridge.log

      - name: Start Polygon fork
        shell: bash
        run: |
          set -euo pipefail
          anvil --fork-url "$POLYGON_RPC_URL" --fork-block-number "$FORK_BLOCK_NUMBER" --chain-id 137 --hardfork shanghai --host 127.0.0.1 --port 8545 > reports/consolidated-anvil.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -s "$LOCAL_FORK_URL" -H 'content-type: application/json' --data '{"jsonrpc":"2.0","method":"eth_chainId","params":[],"id":1}' | grep -q '0x89'; then exit 0; fi
            sleep 1
          done
          cat reports/consolidated-anvil.log
          exit 1

      - name: Run consolidated Polygon WPOL integration
        shell: bash
        run: |
          set -euo pipefail
          npx hardhat test test/qe_qt_integrated_solvency_polygon_fork.js --network polygonFork 2>&1 | tee reports/consolidated-polygon-fork.log

      - name: Run deterministic 20000-block model
        run: python simulation/consolidated_solvency_v3.py 2>&1 | tee reports/consolidated-model.log

      - name: Run stress matrix
        run: python simulation/stress_matrix_v3.py 2>&1 | tee reports/stress-matrix.log

      - name: Run 1000x20000 Monte Carlo
        run: python simulation/monte_carlo_v3.py 2>&1 | tee reports/monte-carlo.log

      - name: Validate solvent-system acceptance criteria
        run: python scripts/validate_consolidated_solvency.py 2>&1 | tee reports/solvency-verdict.log

      - name: Upload consolidated solvency evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: consolidated-solvency-v3-evidence
          path: reports/*
          if-no-files-found: warn
