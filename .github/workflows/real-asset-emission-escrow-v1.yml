name: Real Asset Emission Escrow V1

on:
  push:
    paths:
      - 'contracts/centralbank/**'
      - 'contracts/test/MockControlledEmissionTokenV1.sol'
      - 'test/real_asset_emission_escrow_v1.js'
      - 'hardhat.config.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/real-asset-emission-escrow-v1.yml'
  pull_request:
    paths:
      - 'contracts/centralbank/**'
      - 'contracts/test/MockControlledEmissionTokenV1.sol'
      - 'test/real_asset_emission_escrow_v1.js'
      - 'hardhat.config.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/real-asset-emission-escrow-v1.yml'

jobs:
  escrow:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npx hardhat compile
      - run: npx hardhat test test/real_asset_emission_escrow_v1.js
